# Supabase CLI-configuratie voor lokale ontwikkeling (`npx supabase start`).
project_id = "studio-brutaal"

[api]
enabled = true
port = 54321
# 'finance' is het afgeschermde schema (alleen eigenaar via RLS). Bij een gehost
# project moet 'finance' ook bij Settings → API → Exposed schemas staan.
schemas = ["public", "graphql_public", "finance"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# De ontwikkelseed draait bewust NIET automatisch; zie `npm run db:seed`.
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
# Geen open registratie: accounts ontstaan alleen via uitnodiging door de eigenaar.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
